name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma Client is generated from the schema only — no live database
      # connection needed, so this is safe to run without secrets. A
      # placeholder DATABASE_URL is still required: prisma.config.ts resolves
      # it eagerly via env(), which throws if the variable is unset, even
      # though `generate` never connects to it.
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
